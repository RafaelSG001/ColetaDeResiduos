<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <title>Cadastro de Tipo de Edificação &mdash; Sistema de Coleta de Resíduos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="/css/bootstrap-academico.css" rel="stylesheet" th:href="@{/css/bootstrap-academico.css}"/>
</head>
<body>
<div th:replace="~{fragmentos/menu :: menu}"></div>
<main class="container-fluid academic-container py-4">
    <section class="card border-0 shadow-sm academic-surface">
        <div class="card-body p-3 p-md-4 p-xl-5">
            <h1 class="h3 fw-bold text-dark mb-2" th:text="${tipoEdificacao.idTipo == null} ? 'Novo Tipo de Edificação' : 'Editar Tipo de Edificação'">Cadastro</h1>
            <p class="text-secondary mb-4">Preencha os dados e salve o registro.</p>
            <section class="card border rounded-3 p-3 p-md-4">
                <form class="academic-form" method="post" th:action="@{/tipos-edificacao/salvar}">
                    <input name="idTipo" th:value="${tipoEdificacao.idTipo}" type="hidden"/>
                    <div class="mb-3">
                        <label class="form-label fw-semibold" for="nomeSegmento">Nome do Segmento</label>
                        <input class="form-control" id="nomeSegmento" maxlength="60" name="nomeSegmento" required th:value="${tipoEdificacao.nomeSegmento}" type="text"/>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold" for="descricaoNorma">Descrição da Norma</label>
                        <input class="form-control" id="descricaoNorma" maxlength="150" name="descricaoNorma" required th:value="${tipoEdificacao.descricaoNorma}" type="text"/>
                    </div>
                    <div class="form-check mb-3">
                        <input class="form-check-input" id="exigeLicencaEspecial" name="exigeLicencaEspecial" th:checked="${tipoEdificacao.exigeLicencaEspecial}" type="checkbox" value="true"/>
                        <label class="form-check-label" for="exigeLicencaEspecial">Exige Licença Ambiental Especial (MTR Obrigatório)</label>
                    </div>
                    <div class="d-flex flex-wrap gap-2 align-items-center mt-3">
                        <button class="btn btn-primary" type="submit">Salvar</button>
                        <a class="btn btn-outline-secondary" th:href="@{/tipos-edificacao}">Cancelar</a>
                    </div>
                </form>
            </section>
        </div>
    </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
