<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <title>Cadastro de Empresa &mdash; Sistema de Coleta de Resíduos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="/css/bootstrap-academico.css" rel="stylesheet" th:href="@{/css/bootstrap-academico.css}"/>
</head>
<body>
<div th:replace="~{fragmentos/menu :: menu}"></div>
<main class="container-fluid academic-container py-4">
    <section class="card border-0 shadow-sm academic-surface">
        <div class="card-body p-3 p-md-4 p-xl-5">
            <h1 class="h3 fw-bold text-dark mb-2" th:text="${empresa.idEmpresa == null} ? 'Nova Empresa Operadora' : 'Editar Empresa Operadora'">Cadastro</h1>
            <p class="text-secondary mb-4">Preencha os dados e salve o registro.</p>
            <section class="card border rounded-3 p-3 p-md-4">
                <form class="academic-form" method="post" th:action="@{/empresas/salvar}">
                    <input name="idEmpresa" th:value="${empresa.idEmpresa}" type="hidden"/>
                    <div class="mb-3">
                        <label class="form-label fw-semibold" for="nomeEmpresa">Nome da Empresa</label>
                        <input class="form-control" id="nomeEmpresa" maxlength="100" name="nomeEmpresa" required th:value="${empresa.nomeEmpresa}" type="text"/>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold" for="cnpjOperadora">CNPJ</label>
                        <input class="form-control" id="cnpjOperadora" maxlength="20" name="cnpjOperadora" required th:value="${empresa.cnpjOperadora}" type="text"/>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-8">
                            <label class="form-label fw-semibold" for="cidadeSede">Cidade Sede</label>
                            <input class="form-control" id="cidadeSede" name="cidadeSede" required th:value="${empresa.cidadeSede}" type="text"/>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-semibold" for="estadoSede">UF</label>
                            <input class="form-control" id="estadoSede" maxlength="2" name="estadoSede" required th:value="${empresa.estadoSede}" type="text"/>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label class="form-label fw-semibold" for="anoFundacao">Ano de Fundação</label>
                            <input class="form-control" id="anoFundacao" name="anoFundacao" required th:value="${empresa.anoFundacao}" type="number"/>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-semibold" for="funcionarios">Funcionários</label>
                            <input class="form-control" id="funcionarios" name="funcionarios" required th:value="${empresa.funcionarios}" type="number"/>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-semibold" for="clientesAtivos">Clientes Ativos</label>
                            <input class="form-control" id="clientesAtivos" name="clientesAtivos" required th:value="${empresa.clientesAtivos}" type="number"/>
                        </div>
                    </div>
                    <div class="form-check mb-3">
                        <input class="form-check-input" id="certificacaoIso14001" name="certificacaoIso14001" th:checked="${empresa.certificacaoIso14001}" type="checkbox" value="true"/>
                        <label class="form-check-label" for="certificacaoIso14001">Possui Certificação Ambiental ISO 14001</label>
                    </div>
                    <div class="d-flex flex-wrap gap-2 align-items-center mt-3">
                        <button class="btn btn-primary" type="submit">Salvar</button>
                        <a class="btn btn-outline-secondary" th:href="@{/empresas}">Cancelar</a>
                    </div>
                </form>
            </section>
        </div>
    </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
