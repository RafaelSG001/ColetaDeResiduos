<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Fragmento de menu</title>
</head>
<body>
<header th:fragment="menu" class="academico-menu" role="banner">
    <link rel="stylesheet" th:href="@{/css/menu-academico.css}">
    <div class="academico-menu__top">
        <a class="academico-menu__brand" th:href="@{/}">
            <img th:src="@{/images/logo-eco.png}" alt="Logo EcoGestão Resíduos" width="36" height="36"
                 style="background: #ffffff; border-radius: 8px; padding: 3px;">
            <span>EcoGestão Resíduos</span>
        </a>
        <div class="academico-menu__actions">
            <span class="academico-menu__user" sec:authorize="isAuthenticated()"
                  sec:authentication="name">Usuário</span>
            <form class="academico-menu__logout" th:action="@{/logout}" method="post">
                <button class="academico-menu__logout-button" type="submit">Sair</button>
            </form>
        </div>
    </div>

    <div class="academico-menu__divider" aria-hidden="true"></div>

    <nav class="academico-menu__links" aria-label="Navegação principal">
        <a th:href="@{/}">Dashboard</a>
        <a th:href="@{/pedidos}">Pedidos de Coleta</a>
        <a th:href="@{/itens-pedido}">Itens &amp; MTR</a>
        <a th:href="@{/clientes}">Clientes</a>
        <a th:href="@{/empresas}">Empresas</a>
        <a th:href="@{/servicos}">Serviços (Resíduos)</a>
        <a th:href="@{/enderecos}">Endereços</a>
        <a th:href="@{/tipos-edificacao}">Tipos de Edificação</a>
        <a th:href="@{/indicadores}">Indicadores ESG</a>
        <a th:href="@{/usuarios}" sec:authorize="hasRole('ADMIN')">Usuários</a>
    </nav>
</header>
</body>
</html>
