<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar — EcoGestão Resíduos</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/logo-eco.png}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/security-academico.css}">
</head>
<body>
<main class="container">
    <section class="card auth-card">
        <div class="card-body p-4 p-lg-5">
            <div class="text-center mb-4">
                <div class="eco-badge-logo">
                    <img th:src="@{/images/logo-eco.png}" alt="Logo EcoGestão Resíduos" width="46" height="46">
                </div>
                <h1 class="h3 page-heading mb-1">EcoGestão Resíduos</h1>
                <p class="text-secondary small mb-0">Portal Corporativo de Coleta e Gestão Ambiental</p>
            </div>

            <div class="alert alert-danger py-2 small" th:if="${param.error}">Usuário ou senha inválidos.</div>
            <div class="alert alert-success py-2 small" th:if="${param.logout}">Sessão encerrada com sucesso.</div>
            <div class="alert alert-warning py-2 small" th:if="${param.expired}">Sua sessão foi encerrada. Entre novamente.</div>

            <form method="post" th:action="@{/login}">
                <div class="mb-3">
                    <label class="form-label fw-semibold small" for="username">Usuário</label>
                    <input class="form-control" id="username" name="username" placeholder="Digite seu usuário" autocomplete="username" required autofocus>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold small" for="password">Senha</label>
                    <input class="form-control" id="password" name="password" type="password" placeholder="Digite sua senha" autocomplete="current-password" required>
                </div>
                <button class="btn btn-primary w-100" type="submit">Entrar no Sistema</button>
            </form>
        </div>
    </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
