<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <title>Cadastro de Serviço &mdash; Sistema de Coleta de Resíduos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="/css/bootstrap-academico.css" rel="stylesheet" th:href="@{/css/bootstrap-academico.css}"/>
</head>
<body>
<div th:replace="~{fragmentos/menu :: menu}"></div>
<main class="container-fluid academic-container py-4">
    <section class="card border-0 shadow-sm academic-surface">
        <div class="card-body p-3 p-md-4 p-xl-5">
            <h1 class="h3 fw-bold text-dark mb-2" th:text="${servico.idServico == null} ? 'Novo Serviço' : 'Editar Serviço'">Cadastro</h1>
            <p class="text-secondary mb-4">Preencha os dados e salve o registro.</p>
            <section class="card border rounded-3 p-3 p-md-4">
                <form class="academic-form" method="post" th:action="@{/servicos/salvar}">
                    <input name="idServico" th:value="${servico.idServico}" type="hidden"/>
                    <div class="mb-3">
                        <label class="form-label fw-semibold" for="tipoResiduo">Tipo de Resíduo</label>
                        <input class="form-control" id="tipoResiduo" maxlength="50" name="tipoResiduo" required th:value="${servico.tipoResiduo}" type="text"/>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold" for="classePericulosidade">Classe de Periculosidade</label>
                        <input class="form-control" id="classePericulosidade" maxlength="60" name="classePericulosidade" required th:value="${servico.classePericulosidade}" type="text"/>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold" for="destinoPadrao">Destino Padrão</label>
                        <input class="form-control" id="destinoPadrao" maxlength="50" name="destinoPadrao" required th:value="${servico.destinoPadrao}" type="text"/>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold" for="tarifaPorTonelada">Tarifa por Tonelada (R$)</label>
                        <input class="form-control" id="tarifaPorTonelada" min="0" name="tarifaPorTonelada" required step="0.01" th:value="${servico.tarifaPorTonelada}" type="number"/>
                    </div>
                    <div class="form-check mb-3">
                        <input class="form-check-input" id="reciclavel" name="reciclavel" th:checked="${servico.reciclavel}" type="checkbox" value="true"/>
                        <label class="form-check-label" for="reciclavel">Material Reciclável</label>
                    </div>
                    <div class="d-flex flex-wrap gap-2 align-items-center mt-3">
                        <button class="btn btn-primary" type="submit">Salvar</button>
                        <a class="btn btn-outline-secondary" th:href="@{/servicos}">Cancelar</a>
                    </div>
                </form>
            </section>
        </div>
    </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
