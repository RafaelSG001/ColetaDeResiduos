<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <title>Cadastro de Indicador Mensal &mdash; Sistema de Coleta de Resíduos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="/css/bootstrap-academico.css" rel="stylesheet" th:href="@{/css/bootstrap-academico.css}"/>
</head>
<body>
<div th:replace="~{fragmentos/menu :: menu}"></div>
<main class="container-fluid academic-container py-4">
    <section class="card border-0 shadow-sm academic-surface">
        <div class="card-body p-3 p-md-4 p-xl-5">
            <h1 class="h3 fw-bold text-dark mb-2" th:text="${indicadorMensal.idIndicador == null} ? 'Novo Indicador Mensal' : 'Editar Indicador Mensal'">Cadastro</h1>
            <p class="text-secondary mb-4">Preencha os dados e salve o registro.</p>
            <section class="card border rounded-3 p-3 p-md-4">
                <form class="academic-form" method="post" th:action="@{/indicadores/salvar}">
                    <input name="idIndicador" th:value="${indicadorMensal.idIndicador}" type="hidden"/>
                    <div class="mb-3">
                        <label class="form-label fw-semibold" for="empresaId">Empresa Operadora</label>
                        <select class="form-select" id="empresaId" name="empresaId" required>
                            <option value="">Selecione...</option>
                            <option th:each="op : ${empresas}" th:selected="${indicadorMensal.empresa != null and indicadorMensal.empresa.idEmpresa == op.idEmpresa}" th:text="${op.nomeEmpresa}" th:value="${op.idEmpresa}"></option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold" for="mesReferencia">Mês de Referência (AAAA-MM)</label>
                        <input class="form-control" id="mesReferencia" maxlength="7" name="mesReferencia" placeholder="2026-11" required th:value="${indicadorMensal.mesReferencia}" type="text"/>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold" for="totalResiduosTon">Total de Resíduos (ton)</label>
                            <input class="form-control" id="totalResiduosTon" name="totalResiduosTon" required step="0.01" th:value="${indicadorMensal.totalResiduosTon}" type="number"/>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold" for="taxaReciclagemPercentual">Taxa de Reciclagem (%)</label>
                            <input class="form-control" id="taxaReciclagemPercentual" name="taxaReciclagemPercentual" required step="0.01" th:value="${indicadorMensal.taxaReciclagemPercentual}" type="number"/>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold" for="custoTotalOperacao">Custo Total (R$)</label>
                            <input class="form-control" id="custoTotalOperacao" name="custoTotalOperacao" required step="0.01" th:value="${indicadorMensal.custoTotalOperacao}" type="number"/>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold" for="receitaTotal">Receita Total (R$)</label>
                            <input class="form-control" id="receitaTotal" name="receitaTotal" required step="0.01" th:value="${indicadorMensal.receitaTotal}" type="number"/>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold" for="emissaoCo2Evitaton">CO₂ Evitado (ton)</label>
                            <input class="form-control" id="emissaoCo2Evitaton" name="emissaoCo2Evitaton" required step="0.01" th:value="${indicadorMensal.emissaoCo2Evitaton}" type="number"/>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold" for="clientesAtendidos">Clientes Atendidos</label>
                            <input class="form-control" id="clientesAtendidos" name="clientesAtendidos" required th:value="${indicadorMensal.clientesAtendidos}" type="number"/>
                        </div>
                    </div>
                    <div class="d-flex flex-wrap gap-2 align-items-center mt-3">
                        <button class="btn btn-primary" type="submit">Salvar</button>
                        <a class="btn btn-outline-secondary" th:href="@{/indicadores}">Cancelar</a>
                    </div>
                </form>
            </section>
        </div>
    </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
