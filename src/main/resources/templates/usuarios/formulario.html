<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastro de usuário — Sistema de Coleta de Resíduos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/bootstrap-academico.css}">
    <link rel="stylesheet" th:href="@{/css/menu-academico.css}">
    <style>
        body {background:#f6f8fc;color:#17365d}
        .formulario-usuario {max-width:850px}
        .painel-formulario {border:1px solid #dce5f0;border-radius:14px}
        .obrigatorio::after {content:' *';color:#bd2130}
    </style>
</head>
<body>
<div th:replace="~{fragmentos/menu :: menu}"></div>
<main class="container-fluid formulario-usuario px-3 px-md-4 py-4">
  <section class="card painel-formulario shadow-sm">
    <div class="card-body p-3 p-md-4 p-lg-5">
      <h1 class="h3 fw-bold mb-1" th:text="${usuario.id == null ? 'Novo usuário' : 'Editar usuário'}">Novo usuário</h1>
      <p class="text-secondary mb-4">Informe os dados de acesso e o perfil do usuário.</p>
      <div class="alert alert-danger" th:if="${erro}" th:text="${erro}">Erro.</div>
      <div class="alert alert-success" th:if="${sucesso}" th:text="${sucesso}">Sucesso.</div>
      <form method="post" th:action="@{/usuarios/salvar}" th:object="${usuario}">
        <input type="hidden" th:field="*{id}">
        <div class="mb-3">
          <label class="form-label obrigatorio" for="username">Usuário</label>
          <input type="text" class="form-control" id="username" th:field="*{username}"
                 maxlength="80" autocomplete="off" required>
          <div class="form-text">Nome utilizado para entrar no sistema. O próprio administrador não pode alterá-lo durante a sessão.</div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="novaSenha"
                 th:text="${usuario.id == null ? 'Senha *' : 'Nova senha'}">Senha</label>
          <input type="password" class="form-control" id="novaSenha" name="novaSenha"
                 autocomplete="new-password" th:required="${usuario.id == null}" minlength="8">
          <div class="form-text" th:if="${usuario.id == null}">Informe uma senha com pelo menos 8 caracteres.</div>
          <div class="form-text" th:if="${usuario.id != null}">Deixe em branco para manter a senha atual.</div>
        </div>
        <div class="mb-3">
          <label class="form-label obrigatorio" for="perfil">Perfil</label>
          <select class="form-select" id="perfil" th:field="*{perfil}" required>
            <option value="">Selecione o perfil</option>
            <option th:each="perfil : ${perfis}" th:value="${perfil.name()}"
                    th:text="${perfil.descricao}">ADMIN</option>
          </select>
        </div>
        <div class="form-check form-switch mb-4">
          <input type="checkbox" class="form-check-input" id="ativo" th:field="*{ativo}">
          <label class="form-check-label" for="ativo">Conta ativa</label>
        </div>
        <div class="d-flex flex-wrap gap-2 justify-content-end">
          <a class="btn btn-outline-secondary" th:href="@{/usuarios}">Cancelar</a>
          <button type="submit" class="btn btn-primary"
                  th:text="${usuario.id == null ? 'Cadastrar usuário' : 'Salvar alterações'}">Salvar</button>
        </div>
      </form>
    </div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
