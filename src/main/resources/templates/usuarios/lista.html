<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Usuários — Sistema de Coleta de Resíduos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/bootstrap-academico.css}">
    <link rel="stylesheet" th:href="@{/css/menu-academico.css}">
    <style>
        body {background:#f6f8fc;color:#17365d}
        .pagina-usuarios {max-width:1280px}
        .painel-usuarios {border:1px solid #dce5f0;border-radius:14px}
        .table thead th {color:#475d78;background:#f4f7fb}
        .table td,.table th {vertical-align:middle}
        .acoes-usuario {white-space:nowrap}
    </style>
</head>
<body>
<div th:replace="~{fragmentos/menu :: menu}"></div>
<main class="container-fluid pagina-usuarios px-3 px-md-4 py-4">
    <section class="card painel-usuarios shadow-sm">
        <div class="card-body p-3 p-md-4">
            <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
                <div><h1 class="h3 fw-bold mb-1">Usuários</h1>
                    <p class="text-secondary mb-0">Gerencie os usuários e seus perfis de acesso.</p></div>
                <a class="btn btn-primary" th:href="@{/usuarios/novo}" sec:authorize="hasRole('ADMIN')">Novo usuário</a>
            </div>
            <div class="alert alert-success alert-dismissible fade show" role="alert" th:if="${sucesso}">
                <span th:text="${sucesso}">Operação concluída.</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
            </div>
            <div class="alert alert-danger alert-dismissible fade show" role="alert" th:if="${erro}">
                <span th:text="${erro}">Não foi possível concluir.</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
            </div>
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                    <tr>
                        <th>Usuário</th>
                        <th>Perfil</th>
                        <th>Situação</th>
                        <th class="text-end">Ações</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="usuario : ${usuarios}">
                        <td class="fw-semibold" th:text="${usuario.username}">admin</td>
                        <td th:text="${usuario.perfil != null ? usuario.perfil.descricao : '-'}">ADMIN</td>
                        <td><span th:if="${usuario.ativo}" class="badge text-bg-success">Ativo</span>
                            <span th:unless="${usuario.ativo}" class="badge text-bg-secondary">Inativo</span></td>
                        <td class="text-end acoes-usuario" sec:authorize="hasRole('ADMIN')">
                            <a class="btn btn-sm btn-outline-primary me-1"
                               th:href="@{/usuarios/{id}/editar(id=${usuario.id})}">Editar</a>
                            <form class="d-inline" method="post"
                                  th:action="@{/usuarios/{id}/excluir(id=${usuario.id})}"
                                  onsubmit="return confirm('Deseja realmente excluir este usuário?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Excluir</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${usuarios == null or #lists.isEmpty(usuarios)}">
                        <td colspan="4" class="text-center text-secondary py-4">Nenhum usuário cadastrado.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
