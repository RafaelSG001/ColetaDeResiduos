<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <title>Cadastro de Item de Coleta &mdash; Sistema de Coleta de Resíduos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="/css/bootstrap-academico.css" rel="stylesheet" th:href="@{/css/bootstrap-academico.css}"/>
</head>
<body>
<div th:replace="~{fragmentos/menu :: menu}"></div>
<main class="container-fluid academic-container py-4">
    <section class="card border-0 shadow-sm academic-surface">
        <div class="card-body p-3 p-md-4 p-xl-5">
            <h1 class="h3 fw-bold text-dark mb-2" th:text="${itemPedido.idItem == null} ? 'Novo Item de Coleta (MTR)' : 'Editar Item de Coleta (MTR)'">Cadastro</h1>
            <p class="text-secondary mb-4">Preencha os dados do item associado ao pedido, serviço e endereço.</p>
            <section class="card border rounded-3 p-3 p-md-4">
                <form class="academic-form" method="post" th:action="@{/itens-pedido/salvar}">
                    <input name="idItem" th:value="${itemPedido.idItem}" type="hidden"/>
                    <div class="mb-3">
                        <label class="form-label fw-semibold" for="pedidoId">Pedido de Coleta</label>
                        <select class="form-select" id="pedidoId" name="pedidoId" required>
                            <option value="">Selecione...</option>
                            <option th:each="op : ${pedidos}" th:selected="${itemPedido.pedido != null and itemPedido.pedido.idPedido == op.idPedido}" th:text="|${op.codigoProtocolo} - ${op.empresa.nomeEmpresa}|" th:value="${op.idPedido}"></option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold" for="servicoId">Serviço / Tipo de Resíduo</label>
                        <select class="form-select" id="servicoId" name="servicoId" required>
                            <option value="">Selecione...</option>
                            <option th:each="op : ${servicos}" th:selected="${itemPedido.servico != null and itemPedido.servico.idServico == op.idServico}" th:text="|${op.tipoResiduo} (R$ ${op.tarifaPorTonelada}/t)|" th:value="${op.idServico}"></option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold" for="enderecoId">Endereço da Coleta</label>
                        <select class="form-select" id="enderecoId" name="enderecoId" required>
                            <option value="">Selecione...</option>
                            <option th:each="op : ${enderecos}" th:selected="${itemPedido.endereco != null and itemPedido.endereco.idEndereco == op.idEndereco}" th:text="|${op.logradouro} - ${op.cidade}/${op.estadoUf}|" th:value="${op.idEndereco}"></option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold" for="pesoToneladas">Peso Coletado (Toneladas)</label>
                        <input class="form-control" id="pesoToneladas" min="0.01" name="pesoToneladas" required step="0.01" th:value="${itemPedido.pesoToneladas}" type="number"/>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold" for="destinoFinal">Destino Final</label>
                        <input class="form-control" id="destinoFinal" name="destinoFinal" required th:value="${itemPedido.destinoFinal}" type="text"/>
                    </div>
                    <div class="d-flex flex-wrap gap-2 align-items-center mt-3">
                        <button class="btn btn-primary" type="submit">Salvar</button>
                        <a class="btn btn-outline-secondary" th:href="@{/itens-pedido}">Cancelar</a>
                    </div>
                </form>
            </section>
        </div>
    </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
