<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <title>Itens de Coleta &amp; MTR &mdash; Sistema de Coleta de Resíduos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="/css/bootstrap-academico.css" rel="stylesheet" th:href="@{/css/bootstrap-academico.css}"/>
</head>
<body>
<div th:replace="~{fragmentos/menu :: menu}"></div>
<main class="container-fluid academic-container py-4">
    <section class="card border-0 shadow-sm academic-surface">
        <div class="card-body p-3 p-md-4 p-xl-5">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
                <div>
                    <h1 class="h3 fw-bold text-dark mb-2">Itens de Coleta &amp; Certificados MTR</h1>
                    <p class="text-secondary mb-0">Classe associativa que vincula Pedido, Serviço (Tipo de Resíduo), Peso e Endereço de retirada.</p>
                </div>
                <a class="btn btn-primary" th:href="@{/itens-pedido/novo}">+ Novo registro</a>
            </div>
            <div class="alert alert-success" role="status" th:if="${mensagem}" th:text="${mensagem}"></div>
            <div class="alert alert-danger" role="status" th:if="${erro}" th:text="${erro}"></div>

            <form method="get" th:action="@{/itens-pedido}" class="row g-2 align-items-end mb-4 p-3 bg-light rounded border">
                <div class="col-md-5">
                    <label class="form-label small fw-semibold">Serviço / Tipo de Resíduo</label>
                    <select name="idServico" class="form-select form-select-sm">
                        <option value="">Todos</option>
                        <option th:each="sv : ${servicos}" th:value="${sv.idServico}" th:text="${sv.tipoResiduo}" th:selected="${sv.idServico == idServicoFiltro}"></option>
                    </select>
                </div>
                <div class="col-md-5">
                    <label class="form-label small fw-semibold">Destino Final</label>
                    <input type="text" name="destino" class="form-control form-control-sm" placeholder="Ex: Reciclagem, Compostagem..." th:value="${destinoFiltro}">
                </div>
                <div class="col-md-2 d-flex gap-2">
                    <button type="submit" class="btn btn-sm btn-primary w-100">Filtrar</button>
                    <a th:href="@{/itens-pedido}" class="btn btn-sm btn-outline-secondary w-100">Limpar</a>
                </div>
            </form>

            <div class="card border rounded-3 p-3 p-md-4">
                <div class="table-responsive">
                    <table class="table table-hover table-striped align-middle mb-0">
                        <thead>
                        <tr>
                            <th>Certificado MTR</th>
                            <th>Protocolo Pedido</th>
                            <th>Resíduo (Serviço)</th>
                            <th>Peso (ton)</th>
                            <th>Destino Final</th>
                            <th>Local de Coleta</th>
                            <th>Ações</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="item : ${itens}">
                            <td class="fw-semibold" th:text="${item.numeroMtrCertificado}">—</td>
                            <td th:text="${item.pedido.codigoProtocolo}">—</td>
                            <td th:text="${item.servico.tipoResiduo}">—</td>
                            <td th:text="|${item.pesoToneladas} t|">—</td>
                            <td th:text="${item.destinoFinal}">—</td>
                            <td th:text="|${item.endereco.cidade} - ${item.endereco.estadoUf} (${item.endereco.tipoEdificacao.nomeSegmento})|">—</td>
                            <td>
                                <div class="d-flex flex-wrap gap-2 align-items-center">
                                    <a class="btn btn-sm btn-outline-secondary" th:href="@{/itens-pedido/{id}/editar(id=${item.idItem})}">Editar</a>
                                    <form sec:authorize="hasRole('ADMIN')" method="post" th:action="@{/itens-pedido/{id}/excluir(id=${item.idItem})}">
                                        <button class="btn btn-sm btn-outline-danger" type="submit">Excluir</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <div class="d-flex justify-content-end gap-2 mt-3">
                    <a th:if="${paginaAtual > 0}" th:href="@{/itens-pedido(page=${paginaAtual - 1}, idServico=${idServicoFiltro}, destino=${destinoFiltro})}" class="btn btn-sm btn-outline-secondary">&lsaquo; Anterior</a>
                    <a th:if="${paginaAtual < totalPaginas - 1}" th:href="@{/itens-pedido(page=${paginaAtual + 1}, idServico=${idServicoFiltro}, destino=${destinoFiltro})}" class="btn btn-sm btn-outline-secondary">Próxima &rsaquo;</a>
                </div>
            </div>
        </div>
    </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
