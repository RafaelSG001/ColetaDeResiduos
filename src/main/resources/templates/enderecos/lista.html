<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <title>Endereços de Coleta &mdash; Sistema de Coleta de Resíduos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="/css/bootstrap-academico.css" rel="stylesheet" th:href="@{/css/bootstrap-academico.css}"/>
</head>
<body>
<div th:replace="~{fragmentos/menu :: menu}"></div>
<main class="container-fluid academic-container py-4">
    <section class="card border-0 shadow-sm academic-surface">
        <div class="card-body p-3 p-md-4 p-xl-5">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
                <div>
                    <h1 class="h3 fw-bold text-dark mb-2">Endereços de Coleta</h1>
                    <p class="text-secondary mb-0">Locais físicos de retirada compostos por Tipo de Edificação.</p>
                </div>
                <a class="btn btn-primary" th:href="@{/enderecos/novo}" sec:authorize="hasAnyRole('ADMIN','OPERADOR')">+ Novo registro</a>
            </div>
            <div class="alert alert-success" role="status" th:if="${mensagem}" th:text="${mensagem}"></div>
            <div class="alert alert-danger" role="status" th:if="${erro}" th:text="${erro}"></div>
            <div class="card border rounded-3 p-3 p-md-4">
                <div class="table-responsive">
                    <table class="table table-hover table-striped align-middle mb-0">
                        <thead>
                        <tr>
                            <th>Logradouro</th>
                            <th>Número</th>
                            <th>CEP</th>
                            <th>Cidade / UF</th>
                            <th>Tipo de Edificação</th>
                            <th>Ações</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="item : ${enderecos}">
                            <td class="fw-semibold" th:text="${item.logradouro}">—</td>
                            <td th:text="${item.numero}">—</td>
                            <td th:text="${item.cep}">—</td>
                            <td th:text="|${item.cidade} - ${item.estadoUf}|">—</td>
                            <td th:text="${item.tipoEdificacao.nomeSegmento}">—</td>
                            <td>
                                <div class="d-flex flex-wrap gap-2 align-items-center">
                                    <a class="btn btn-sm btn-outline-secondary" th:href="@{/enderecos/{id}/editar(id=${item.idEndereco})}" sec:authorize="hasAnyRole('ADMIN','OPERADOR')">Editar</a>
                                    <form sec:authorize="hasRole('ADMIN')" method="post" th:action="@{/enderecos/{id}/excluir(id=${item.idEndereco})}">
                                        <button class="btn btn-sm btn-outline-danger" type="submit">Excluir</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
