<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <title>Cadastro de Endereço &mdash; Sistema de Coleta de Resíduos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="/css/bootstrap-academico.css" rel="stylesheet" th:href="@{/css/bootstrap-academico.css}"/>
</head>
<body>
<div th:replace="~{fragmentos/menu :: menu}"></div>
<main class="container-fluid academic-container py-4">
    <section class="card border-0 shadow-sm academic-surface">
        <div class="card-body p-3 p-md-4 p-xl-5">
            <h1 class="h3 fw-bold text-dark mb-2" th:text="${endereco.idEndereco == null} ? 'Novo Endereço' : 'Editar Endereço'">Cadastro</h1>
            <p class="text-secondary mb-4">Preencha os dados e salve o registro.</p>
            <section class="card border rounded-3 p-3 p-md-4">
                <form class="academic-form" method="post" th:action="@{/enderecos/salvar}">
                    <input name="idEndereco" th:value="${endereco.idEndereco}" type="hidden"/>
                    <div class="mb-3">
                        <label class="form-label fw-semibold" for="logradouro">Logradouro</label>
                        <input class="form-control" id="logradouro" name="logradouro" required th:value="${endereco.logradouro}" type="text"/>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label class="form-label fw-semibold" for="numero">Número</label>
                            <input class="form-control" id="numero" name="numero" required th:value="${endereco.numero}" type="text"/>
                        </div>
                        <div class="col-md-8">
                            <label class="form-label fw-semibold" for="cep">CEP</label>
                            <input class="form-control" id="cep" name="cep" required th:value="${endereco.cep}" type="text"/>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-8">
                            <label class="form-label fw-semibold" for="cidade">Cidade</label>
                            <input class="form-control" id="cidade" name="cidade" required th:value="${endereco.cidade}" type="text"/>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-semibold" for="estadoUf">UF</label>
                            <input class="form-control" id="estadoUf" maxlength="2" name="estadoUf" required th:value="${endereco.estadoUf}" type="text"/>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold" for="tipoEdificacaoId">Tipo de Edificação</label>
                        <select class="form-select" id="tipoEdificacaoId" name="tipoEdificacaoId" required>
                            <option value="">Selecione...</option>
                            <option th:each="op : ${tiposEdificacao}" th:selected="${endereco.tipoEdificacao != null and endereco.tipoEdificacao.idTipo == op.idTipo}" th:text="${op.nomeSegmento}" th:value="${op.idTipo}"></option>
                        </select>
                    </div>
                    <div class="d-flex flex-wrap gap-2 align-items-center mt-3">
                        <button class="btn btn-primary" type="submit">Salvar</button>
                        <a class="btn btn-outline-secondary" th:href="@{/enderecos}">Cancelar</a>
                    </div>
                </form>
            </section>
        </div>
    </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
