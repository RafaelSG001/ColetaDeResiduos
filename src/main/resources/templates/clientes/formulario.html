<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <title>Cadastro de Cliente &mdash; Sistema de Coleta de Resíduos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="/css/bootstrap-academico.css" rel="stylesheet" th:href="@{/css/bootstrap-academico.css}"/>
</head>
<body>
<div th:replace="~{fragmentos/menu :: menu}"></div>
<main class="container-fluid academic-container py-4">
    <section class="card border-0 shadow-sm academic-surface">
        <div class="card-body p-3 p-md-4 p-xl-5">
            <h1 class="h3 fw-bold text-dark mb-2" th:text="${cliente.idCliente == null} ? 'Novo Cliente' : 'Editar Cliente'">Cadastro</h1>
            <p class="text-secondary mb-4">Preencha os dados e salve o registro.</p>
            <section class="card border rounded-3 p-3 p-md-4">
                <form class="academic-form" method="post" th:action="@{/clientes/salvar}">
                    <input name="idCliente" th:value="${cliente.idCliente}" type="hidden"/>
                    <div class="mb-3">
                        <label class="form-label fw-semibold" for="razaoSocial">Razão Social</label>
                        <input class="form-control" id="razaoSocial" maxlength="120" name="razaoSocial" required th:value="${cliente.razaoSocial}" type="text"/>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold" for="cnpj">CNPJ</label>
                        <input class="form-control" id="cnpj" maxlength="20" name="cnpj" required th:value="${cliente.cnpj}" type="text"/>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold" for="tipoEdificacaoId">Segmento / Tipo de Edificação</label>
                        <select class="form-select" id="tipoEdificacaoId" name="tipoEdificacaoId" required>
                            <option value="">Selecione...</option>
                            <option th:each="op : ${tiposEdificacao}" th:selected="${cliente.tipoEdificacao != null and cliente.tipoEdificacao.idTipo == op.idTipo}" th:text="${op.nomeSegmento}" th:value="${op.idTipo}"></option>
                        </select>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-8">
                            <label class="form-label fw-semibold" for="cidade">Cidade</label>
                            <input class="form-control" id="cidade" name="cidade" required th:value="${cliente.cidade}" type="text"/>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-semibold" for="estadoUf">UF</label>
                            <input class="form-control" id="estadoUf" maxlength="2" name="estadoUf" required th:value="${cliente.estadoUf}" type="text"/>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label class="form-label fw-semibold" for="volumeContratadoMensalTon">Volume Mensal (t)</label>
                            <input class="form-control" id="volumeContratadoMensalTon" name="volumeContratadoMensalTon" required step="0.01" th:value="${cliente.volumeContratadoMensalTon}" type="number"/>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-semibold" for="indiceSatisfacao">Satisfação (0-10)</label>
                            <input class="form-control" id="indiceSatisfacao" max="10" min="0" name="indiceSatisfacao" required step="0.1" th:value="${cliente.indiceSatisfacao}" type="number"/>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-semibold" for="tempoContratoMeses">Tempo Contrato (meses)</label>
                            <input class="form-control" id="tempoContratoMeses" min="1" name="tempoContratoMeses" required th:value="${cliente.tempoContratoMeses}" type="number"/>
                        </div>
                    </div>
                    <div class="form-check mb-3">
                        <input class="form-check-input" id="contratoAtivo" name="contratoAtivo" th:checked="${cliente.contratoAtivo}" type="checkbox" value="true"/>
                        <label class="form-check-label" for="contratoAtivo">Contrato Ativo</label>
                    </div>
                    <div class="d-flex flex-wrap gap-2 align-items-center mt-3">
                        <button class="btn btn-primary" type="submit">Salvar</button>
                        <a class="btn btn-outline-secondary" th:href="@{/clientes}">Cancelar</a>
                    </div>
                </form>
            </section>
        </div>
    </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
