<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <title>Clientes &mdash; Sistema de Coleta de Resíduos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="/css/bootstrap-academico.css" rel="stylesheet" th:href="@{/css/bootstrap-academico.css}"/>
</head>
<body>
<div th:replace="~{fragmentos/menu :: menu}"></div>
<main class="container-fluid academic-container py-4">
    <section class="card border-0 shadow-sm academic-surface">
        <div class="card-body p-3 p-md-4 p-xl-5">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
                <div>
                    <h1 class="h3 fw-bold text-dark mb-2">Clientes Geradores</h1>
                    <p class="text-secondary mb-0">Consulte e gerencie os 1.200 clientes cadastrados.</p>
                </div>
                <a class="btn btn-primary" th:href="@{/clientes/novo}" sec:authorize="hasAnyRole('ADMIN','OPERADOR')">+ Novo registro</a>
            </div>
            <div class="alert alert-success" role="status" th:if="${mensagem}" th:text="${mensagem}"></div>
            <div class="alert alert-danger" role="status" th:if="${erro}" th:text="${erro}"></div>

            <form method="get" th:action="@{/clientes}" class="row g-2 align-items-end mb-4 p-3 bg-light rounded border">
                <div class="col-md-5">
                    <label class="form-label small fw-semibold">Busca por Razão Social ou Cidade</label>
                    <input type="text" name="busca" class="form-control form-control-sm" placeholder="Ex: Curitiba, Hospital..." th:value="${buscaFiltro}">
                </div>
                <div class="col-md-5">
                    <label class="form-label small fw-semibold">Tipo de Edificação / Segmento</label>
                    <select name="idTipo" class="form-select form-select-sm">
                        <option value="">Todos</option>
                        <option th:each="t : ${tiposEdificacao}" th:value="${t.idTipo}" th:text="${t.nomeSegmento}" th:selected="${t.idTipo == idTipoFiltro}"></option>
                    </select>
                </div>
                <div class="col-md-2 d-flex gap-2">
                    <button type="submit" class="btn btn-sm btn-primary w-100">Filtrar</button>
                    <a th:href="@{/clientes}" class="btn btn-sm btn-outline-secondary w-100">Limpar</a>
                </div>
            </form>

            <div class="card border rounded-3 p-3 p-md-4">
                <div class="table-responsive">
                    <table class="table table-hover table-striped align-middle mb-0">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Razão Social</th>
                            <th>CNPJ</th>
                            <th>Segmento</th>
                            <th>Cidade / UF</th>
                            <th>Vol. Mensal (t)</th>
                            <th>Satisfação</th>
                            <th>Ativo</th>
                            <th>Ações</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="item : ${clientes}">
                            <td th:text="|#${item.idCliente}|">—</td>
                            <td class="fw-semibold" th:text="${item.razaoSocial}">—</td>
                            <td th:text="${item.cnpj}">—</td>
                            <td th:text="${item.tipoEdificacao.nomeSegmento}">—</td>
                            <td th:text="|${item.cidade} - ${item.estadoUf}|">—</td>
                            <td th:text="${item.volumeContratadoMensalTon}">—</td>
                            <td th:text="${item.indiceSatisfacao}">—</td>
                            <td th:text="${item.contratoAtivo ? 'Sim' : 'Não'}">—</td>
                            <td>
                                <div class="d-flex flex-wrap gap-2 align-items-center">
                                    <a class="btn btn-sm btn-outline-secondary" th:href="@{/clientes/{id}/editar(id=${item.idCliente})}" sec:authorize="hasAnyRole('ADMIN','OPERADOR')">Editar</a>
                                    <form sec:authorize="hasRole('ADMIN')" method="post" th:action="@{/clientes/{id}/excluir(id=${item.idCliente})}">
                                        <button class="btn btn-sm btn-outline-danger" type="submit">Excluir</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <div class="d-flex justify-content-end gap-2 mt-3">
                    <a th:if="${paginaAtual > 0}" th:href="@{/clientes(page=${paginaAtual - 1}, busca=${buscaFiltro}, idTipo=${idTipoFiltro})}" class="btn btn-sm btn-outline-secondary">&lsaquo; Anterior</a>
                    <a th:if="${paginaAtual < totalPaginas - 1}" th:href="@{/clientes(page=${paginaAtual + 1}, busca=${buscaFiltro}, idTipo=${idTipoFiltro})}" class="btn btn-sm btn-outline-secondary">Próxima &rsaquo;</a>
                </div>
            </div>
        </div>
    </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
