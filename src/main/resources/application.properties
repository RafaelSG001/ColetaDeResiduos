# ======================================================================
# APP
# ======================================================================
spring.application.name=ColetaDeResiduos
server.port=8082

# Credenciais padrão de laboratório (também aceita variáveis de ambiente APP_ADMIN_USER e APP_ADMIN_PASSWORD)
APP_ADMIN_USER=admin
APP_ADMIN_PASSWORD=admin123

# ======================================================================
# DATASOURCE H2 (persistente em arquivo local)
# ======================================================================
spring.datasource.url=jdbc:h2:file:./database/faculdade;DB_CLOSE_ON_EXIT=FALSE;INIT=CREATE SCHEMA IF NOT EXISTS APP\\;SET SCHEMA APP
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ======================================================================
# H2 CONSOLE
# ======================================================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.profiles.active=dev

# ======================================================================
# JPA / HIBERNATE
# ======================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=APP
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ======================================================================
# UTF-8
# ======================================================================
spring.output.ansi.enabled=ALWAYS
spring.messages.encoding=UTF-8
